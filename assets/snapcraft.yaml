name: a9edit
base: core24
version: "2.0.0"
title: a9Edit
summary: A text editor with Japanese writing support
description: |
  a9Edit is based on Microsoft Edit and adds selection latching, Japanese
  character wrapping, ruby and emphasis display, and line-breaking warnings.

  Disclaimer: This is an unofficial Snap and it is not endorsed by nor affiliated officially with Microsoft Corporation.

grade: stable
confinement: strict

apps:
  a9edit:
    command: bin/a9Edit
    plugs:
      - home

parts:
  a9edit:
    source: .
    plugin: rust
    build-packages:
      - build-essential
